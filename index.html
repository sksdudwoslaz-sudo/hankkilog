<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#718467"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>한끼록</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f0;color:#394435;font:16px -apple-system,sans-serif}main{max-width:600px;margin:auto;padding:24px 18px 100px}h1{margin:0;font-size:30px}small{color:#777}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:12px;background:#718467;color:white}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd9cb;border-radius:10px;background:white;margin:5px 0 12px}label{display:block;font-size:14px}textarea{min-height:85px}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf7;display:flex;justify-content:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{background:none;color:#52654a;flex:1;max-width:120px;font-size:13px}.hero,.entry{background:#e8ecdf;border-radius:18px;padding:18px;margin:16px 0}.entry{background:#fffdf8;overflow:hidden}.entry img{width:100%;height:180px;object-fit:cover;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .entry{padding:10px;margin:0}.grid img{height:120px}.muted{background:#eee9dd;color:#52654a}.danger{background:#a45e50}pre{white-space:pre-wrap;font:inherit}h2{font-size:20px}.stars{color:#ad8034}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}</style><main id="app"></main><nav id="nav"></nav><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10), won=n=>Number(n||0).toLocaleString('ko-KR')+'원';let db;let data=[],tab='home',editing=null,photo='',budget=300000,month=today().slice(0,7);const req=indexedDB.open('hankkilog',1);req.onupgradeneeded=()=>req.result.createObjectStore('records',{keyPath:'id'});req.onsuccess=()=>{db=req.result;load()};req.onerror=()=>alert('저장소를 열 수 없습니다. Safari 설정을 확인하세요.');function load(){let q=db.transaction('records').objectStore('records').getAll();q.onsuccess=()=>{data=q.result.sort((a,b)=>b.id-a.id);render()}}function save(a){let t=db.transaction('records','readwrite');t.objectStore('records').put(a);t.oncomplete=load;t.onerror=()=>alert('저장 실패') }function go(t){tab=t;editing=null;render()}function cards(items){return items.length?'<div class="grid">'+items.map(a=>`<article class="entry" onclick="detail(${a.id})">${a.photo?`<img src="${esc(a.photo)}">`:'<div style="font-size:42px;text-align:center;padding:24px">'+(a.type==='r'?'🍽️':'🥘')+'</div>'}<b>${esc(a.name)}</b><p><small>${a.type==='r'?esc(a.date)+' · '+won(a.price):esc(a.time)+'분 · '+esc(a.servings)+'인분'}</small></p>${a.type==='r'?'<span class="stars">'+'★'.repeat(Number(a.rating||0))+'</span>':''}</article>`).join('')+'</div>':'<p><small>아직 기록이 없어요.</small></p>'}function render(){let r=data.filter(a=>a.type==='r'),p=data.filter(a=>a.type==='p'),total=r.filter(a=>a.date.startsWith(month)).reduce((s,a)=>s+Number(a.price),0);$('#nav').innerHTML=[['home','⌂ 홈'],['calendar','▦ 달력'],['r','♧ 맛집'],['p','▤ 레시피'],['my','⚙ MY']].map(([t,l])=>`<button onclick="go('${t}')">${l}</button>`).join('');let h='';if(tab==='home')h=`<h1>한끼록 🌿</h1><small>맛있는 순간을 차곡차곡.</small><div class="hero"><small>이번 달 외식비</small><h1>${won(r.filter(a=>a.date.startsWith(today().slice(0,7))).reduce((s,a)=>s+Number(a.price),0))}</h1></div><div class="row"><button onclick="openRecordForm('r')">＋ 맛집 기록</button><button onclick="openRecordForm('p')">＋ 레시피 추가</button></div><h2>최근 맛집</h2>${cards(r.slice(0,4))}<h2>나의 레시피북</h2>${cards(p.slice(0,4))}`;else if(tab==='r'||tab==='p')h=`<h1>${tab==='r'?'나의 맛집':'레시피북'}</h1><input placeholder="검색" oninput="search(this.value)"><button onclick="openRecordForm('${tab}')">＋ 기록 추가</button><div id="results" style="margin-top:16px">${cards(tab==='r'?r:p)}</div>`;else if(tab==='calendar')h=`<h1>식사 달력</h1><input type="month" value="${month}" onchange="month=this.value;render()"><div class="hero">월 외식비 <h1>${won(total)}</h1></div>${cards(r.filter(a=>a.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)))}`;else h=`<h1>나의 한끼록</h1><div class="hero">맛집 ${r.length}개 · 레시피 ${p.length}개</div><button onclick="backup()">기록 백업 내보내기</button><p><small>기록은 이 기기의 브라우저 저장소에 보관됩니다. 삭제 또는 초기화 시 유실될 수 있습니다.</small></p>`;$('#app').innerHTML=h}function search(v){$('#results').innerHTML=cards(data.filter(a=>a.type===tab&&(a.name+' '+(a.menu||'')).includes(v)))}function openRecordForm(type,id){editing=data.find(a=>a.id===id)||null;let a=editing||{},r=type==='r';photo=a.photo||'';$('#app').innerHTML=`<button class="muted" onclick="go('${type}')">뒤로</button><h2>${r?'맛집 기록':'레시피 기록'}</h2><form id="f"><label>사진<input type="file" accept="image/*" id="pic"></label><div id="preview">${photo?`<img style="width:100%;max-height:180px;object-fit:cover" src="${esc(photo)}">`:''}</div><label>${r?'식당':'요리'} 이름<input required name="name" value="${esc(a.name)}"></label>${r?`<label>메뉴<input name="menu" value="${esc(a.menu)}"></label><label>방문일<input required type="date" name="date" value="${esc(a.date||today())}"></label><label>금액<input type="number" min="0" name="price" value="${esc(a.price)}"></label><label>위치<input name="location" value="${esc(a.location)}"></label><label>별점<select name="rating">${[5,4,3,2,1].map(n=>`<option ${Number(a.rating||5)===n?'selected':''}>${n}</option>`).join('')}</select></label><label>후기<textarea name="memo">${esc(a.memo)}</textarea></label>`:`<label>조리 시간(분)<input type="number" min="1" name="time" value="${esc(a.time||20)}"></label><label>인분<input type="number" min="1" name="servings" value="${esc(a.servings||1)}"></label><label>재료<textarea name="ingredients">${esc(a.ingredients)}</textarea></label><label>조리 순서<textarea name="steps">${esc(a.steps)}</textarea></label><label>참고 링크<input name="link" value="${esc(a.link)}"></label>`}<button type="submit">저장하기</button></form>`;$('#pic').onchange=async e=>{let f=e.target.files[0];if(!f)return;let b=$('#f button');b.disabled=true;try{let img=new Image();img.src=URL.createObjectURL(f);await img.decode();let c=document.createElement('canvas'),scale=Math.min(1,1200/Math.max(img.width,img.height));c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(img.src);$('#preview').innerHTML=`<img style="width:100%;max-height:180px;object-fit:cover" src="${photo}">`}catch{alert('사진을 읽지 못했습니다.')}finally{b.disabled=false}};$('#f').onsubmit=e=>{e.preventDefault();let a=Object.fromEntries(new FormData(e.target));a.id=editing?.id||Date.now();a.type=type;a.photo=photo;tab=type;save(a)}}function detail(id){let a=data.find(x=>x.id===id);$('#app').innerHTML=`<button class="muted" onclick="go('${a.type}')">뒤로</button><div class="entry">${a.photo?`<img src="${esc(a.photo)}">`:''}<h1>${esc(a.name)}</h1>${a.type==='r'?`<p>${esc(a.date)} · ${won(a.price)}</p><p>${esc(a.menu)} · ${esc(a.location)}</p><p class="stars">${'★'.repeat(Number(a.rating))}</p><pre>${esc(a.memo)}</pre>`:`<p>${esc(a.time)}분 · ${esc(a.servings)}인분</p><h2>재료</h2><pre>${esc(a.ingredients)}</pre><h2>조리 순서</h2><pre>${esc(a.steps)}</pre><pre>${esc(a.link)}</pre>`}<div class="row"><button onclick="openRecordForm('${a.type}',${id})">수정</button><button class="danger" onclick="removeRecord(${id})">삭제</button></div></div>`}function removeRecord(id){if(!confirm('삭제할까요?'))return;let t=db.transaction('records','readwrite');t.objectStore('records').delete(id);t.oncomplete=load}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='hankkilog-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}); navigator.serviceWorker?.addEventListener('controllerchange',()=>location.reload());
</script></html>
